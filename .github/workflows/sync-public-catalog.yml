name: Sync public catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and validate public Russian catalog
        env:
          CATALOG_URL: ${{ secrets.NEUROMEDIA_PUBLIC_CATALOG_URL }}
        run: |
          test -n "$CATALOG_URL"
          python3 scripts/sync_public_catalog.py --url "$CATALOG_URL" --output content/catalog/catalog.ru.json
          python3 scripts/validate_catalog.py content/catalog/catalog.ru.json

      - name: Create pull request when catalog changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(catalog): sync public catalog"
          title: "chore(catalog): sync public catalog"
          body: |
            Automated update from the approved public Neuromedia catalog export.

            Review public categories, products, prices, availability, and links before merging.
          branch: automation/sync-public-catalog
          delete-branch: true
